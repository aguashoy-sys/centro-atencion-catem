<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Atención CATEM</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#d9dbd5;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.phone{
  width:100%;
  max-width:480px;
  height:100vh;
  background:#efeae2;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,.15);
}

/* HEADER */

.header{
  background:#075e54;
  color:white;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:68px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.header-info{
  flex:1;
}

.header-title{
  font-weight:bold;
  font-size:17px;
}

.header-status{
  font-size:13px;
  opacity:.9;
  margin-top:3px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 100px;
  background-color:#efeae2;
  background-image:
    radial-gradient(circle at 20px 20px, rgba(0,0,0,.025) 1px, transparent 1px);
  background-size:28px 28px;
}

.message{
  max-width:88%;
  padding:10px 12px;
  border-radius:8px;
  margin-bottom:10px;
  line-height:1.4;
  font-size:15px;
  box-shadow:0 1px 1px rgba(0,0,0,.08);
  animation:fadeIn .25s ease;
}

.bot{
  background:white;
  align-self:flex-start;
}

.user{
  background:#d9fdd3;
  margin-left:auto;
}

.time{
  display:block;
  text-align:right;
  color:#777;
  font-size:10px;
  margin-top:5px;
}

/* OPTIONS */

.options{
  margin:8px 0 16px;
}

.option{
  background:white;
  border:none;
  width:100%;
  text-align:left;
  padding:13px 14px;
  margin-bottom:7px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.10);
  transition:.15s;
}

.option:hover{
  background:#f6f6f6;
}

.option:active{
  transform:scale(.99);
}

.num{
  color:#777;
  font-weight:bold;
  margin-right:7px;
}

/* INPUT */

.input-area{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:8px;
  background:#f0f2f5;
  display:flex;
  gap:7px;
}

.input-area input{
  flex:1;
  border:none;
  border-radius:22px;
  padding:12px 15px;
  font-size:15px;
  outline:none;
  background:white;
}

.send{
  width:44px;
  height:44px;
  border:none;
  border-radius:50%;
  background:#00a884;
  color:white;
  font-size:19px;
  cursor:pointer;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(5px);}
  to{opacity:1; transform:translateY(0);}
}

.small{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div class="phone">

  <div class="header">
    <img src="logo.png" class="logo">
    <div class="header-info">
      <div class="header-title">Centro de Atención CATEM</div>
      <div class="header-status">en línea</div>
    </div>
    <div>⋮</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Escribe un mensaje..."
      disabled
    >
    <button class="send" id="sendButton" disabled>➤</button>
  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

let employeeData = {

"🍽️ Comedor":[

"🤝 Beneficios CATEM":[

"Eventos y actividades CATEM",
"Necesito ayuda para utilizar un beneficio",
"Tengo un problema con un beneficio o convenio",

};

function time(){
  return new Date().toLocaleTimeString("es-MX",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function addMessage(text,type="bot"){

  const div=document.createElement("div");
  div.className="message "+type;

  div.innerHTML=text+
  `<span class="time">${time()}</span>`;

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function addOptions(items,callback){

  const container=document.createElement("div");
  container.className="options";

  items.forEach((item,index)=>{

    const button=document.createElement("button");
    button.className="option";

    button.innerHTML=
    `<span class="num">◾ ${index+1}.</span> ${item}`;

    button.onclick=()=>{

      container.remove();
      addMessage(item,"user");
      callback(item);

    };

    container.appendChild(button);

  });

  chat.appendChild(container);
  chat.scrollTop=chat.scrollHeight;
}

function start(){

  addMessage(`
  👋 ¡Hola! Bienvenido al <b>Centro de Atención CATEM Aguascalientes</b>.<br><br>

  Estamos aquí para <b>escucharte, orientarte y dar seguimiento</b>
  a cualquier duda o situación relacionada con tu trabajo. 🤝<br><br>

  Para comenzar, dinos:<br><br>

  🏭 <b>¿En qué empresa trabajas?</b><br><br>

  Selecciona tu empresa de la lista 👇
  `);

  setTimeout(()=>{

    addOptions(companies,selectCompany);

  },500);

}

function selectCompany(company){

  employeeData.empresa=company;

  setTimeout(()=>{

    addMessage(`
    🤝 Gracias.<br><br>

    📋 <b>¿Sobre qué tema necesitas apoyo?</b><br><br>

    Selecciona una opción 👇
    `);

    addOptions(topics,selectTopic);

  },400);

}

function selectTopic(topic){

  employeeData.tema=topic;

  if(topic==="📝 Otro tema"){
    requestDescription();
    return;
  }

  const list=subtopics[topic];

  setTimeout(()=>{

    addMessage(`
    <b>${topic}</b><br><br>
    ¿Cuál de estas situaciones describe mejor lo que necesitas?
    `);

    addOptions(list,selectSubtopic);

  },400);

}

function selectSubtopic(subtopic){

  employeeData.subtema=subtopic;

  setTimeout(()=>{
    requestDescription();
  },400);

}

function requestDescription(){

  addMessage(`
  📝 <b>Ahora cuéntanos brevemente qué está sucediendo.</b><br><br>

  Describe la situación con tus propias palabras.
  No te preocupes por utilizar términos técnicos; escribe lo que pasó
  de la manera más sencilla posible.<br><br>

  💡 Entre más información nos compartas, mejor podremos orientarte.
  `);

  input.disabled=false;
  sendButton.disabled=false;
  input.focus();

}

function sendDescription(){

  const value=input.value.trim();

  if(!value) return;

  employeeData.descripcion=value;

  addMessage(value,"user");

  input.value="";
  input.disabled=true;
  sendButton.disabled=true;

  setTimeout(()=>{

    addMessage(`
    🤖 <b>Gracias. Estamos analizando tu situación.</b><br><br>

    En la versión completa del Centro de Atención,
    la inteligencia artificial analizará aquí la información
    para determinar cómo podemos orientarte y si es necesario
    canalizar tu caso para atención.
    `);

  },700);

}

sendButton.onclick=sendDescription;

input.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    sendDescription();
  }
});

start();

</script>

</body>
</html>
