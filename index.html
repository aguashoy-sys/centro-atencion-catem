/* UTILIDADES */

function getTime(){
  return new Date().toLocaleTimeString("es-MX",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function firstName(name){
  return name.trim().split(/\s+/)[0] || "";
}

function addMessage(text,type="bot"){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerHTML=text+`<span class="time">${getTime()}</span>`;
  chat.appendChild(div);
  scrollDown();
}


/* BOTONES */

function addOptions(items,callback){

  const container=document.createElement("div");
  container.className="options";

  items.forEach((item,index)=>{

    const button=document.createElement("button");
    button.className="option";

    button.innerHTML=
      `<span class="num">◾ ${index+1}.</span>${escapeHTML(item)}`;

    button.onclick=()=>{
      container.remove();
      addMessage(escapeHTML(item),"user");
      callback(item);
    };

    container.appendChild(button);
  });

  chat.appendChild(container);
  scrollDown();
}


/* SELECTOR */

function addSelector(items,placeholder,callback){

  const box=document.createElement("div");
  box.className="selector-box";

  const select=document.createElement("select");
  select.className="selector";

  const first=document.createElement("option");
  first.value="";
  first.textContent=placeholder;
  first.disabled=true;
  first.selected=true;

  select.appendChild(first);

  items.forEach(item=>{
    const option=document.createElement("option");
    option.value=item;
    option.textContent=item;
    select.appendChild(option);
  });

  const button=document.createElement("button");
  button.className="selector-button";
  button.textContent="Continuar";

  button.onclick=()=>{

    if(!select.value)return;

    const value=select.value;

    box.remove();
    addMessage(escapeHTML(value),"user");
    callback(value);
  };

  box.appendChild(select);
  box.appendChild(button);

  chat.appendChild(box);
  scrollDown();
}


/* INPUT */

function enableInput(placeholder,action){
  currentInputAction=action;
  input.placeholder=placeholder;
  input.disabled=false;
  sendButton.disabled=false;
  input.focus();
}

function disableInput(){
  currentInputAction=null;
  input.value="";
  input.disabled=true;
  sendButton.disabled=true;
  input.placeholder="Escribe un mensaje...";
}

function submitInput(){

  const value=input.value.trim();

  if(!value || !currentInputAction)return;

  const action=currentInputAction;

  addMessage(escapeHTML(value),"user");

  disableInput();

  action(value);
}

sendButton.onclick=submitInput;

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")submitInput();
});


/* INICIO */

function start(){

  addMessage(`
    👋 ¡Hola! Bienvenido al
    <b>Centro de Atención CATEM Aguascalientes</b>.<br><br>

    Estamos aquí para <b>escucharte, orientarte y dar seguimiento</b>
    a cualquier duda o situación relacionada con tu trabajo. 🤝<br><br>

    Para comenzar, dinos:<br><br>

    🏭 <b>¿En qué empresa trabajas?</b>
  `);

  setTimeout(()=>{
    addSelector(
      companies,
      "🏭 Seleccionar empresa",
      selectCompany
    );
  },300);
}

function selectCompany(company){

  data.empresa=company;

  setTimeout(()=>{

    addMessage(`
      🤝 Gracias.<br><br>
      📋 <b>¿Sobre qué tema necesitas apoyo?</b>
    `);

    addSelector(
      topics,
      "📋 Seleccionar tema",
      selectTopic
    );

  },300);
}

function selectTopic(topic){

  data.tema=topic;

  if(topic==="📝 Otro tema"){
    data.subtema="Otro tema";
    requestDescription();
    return;
  }

  setTimeout(()=>{

    addMessage(`
      <b>${escapeHTML(topic)}</b><br><br>
      ¿Cuál de estas situaciones describe mejor lo que necesitas?
    `);

    addOptions(subtopics[topic],selectSubtopic);

  },300);
}

function selectSubtopic(subtopic){
  data.subtema=subtopic;
  setTimeout(requestDescription,300);
}


/* DESCRIPCIÓN */

function requestDescription(){

  addMessage(`
    📝 <b>Ahora cuéntanos brevemente qué está sucediendo.</b><br><br>

    Describe la situación con tus propias palabras.
    No te preocupes por utilizar términos técnicos;
    escribe lo que pasó de la manera más sencilla posible.<br><br>

    💡 Entre más información nos compartas,
    mejor podremos orientarte.
  `);

  enableInput(
    "Describe aquí tu situación...",
    receiveDescription
  );
}

function receiveDescription(value){

  data.descripcion=value;

  /* ESCENARIO 1: VACACIONES */

  if(
    data.tema==="🏖️ Vacaciones y permisos" &&
    data.subtema==="Tengo dudas sobre cuántos días me corresponden"
  ){
    setTimeout(startVacationAI,450);
    return;
  }

  /* ESCENARIO 2: SUNCALL HORAS EXTRAS */

  if(
    data.empresa==="Suncall" &&
    data.tema==="⏰ Horarios y horas extras" &&
    data.subtema==="No me pagaron horas extras"
  ){
    setTimeout(startSuncallOvertime,450);
    return;
  }

  /* ESCENARIO 3: CASO PRIORITARIO */

  if(
    data.tema==="🛑 Maltrato, acoso o discriminación" &&
    data.subtema==="Sufro acoso u hostigamiento sexual"
  ){
    setTimeout(startPriorityCase,450);
    return;
  }

  setTimeout(requestName,400);
}


/* =================================================
   ESCENARIO 1 — ORIENTACIÓN AUTOMÁTICA
================================================= */

function startVacationAI(){

  addMessage(`
    <span class="ai-badge">✨ Orientación inteligente</span><br>

    Entiendo. Para poder calcular los días de vacaciones
    que te corresponden necesito conocer tu antigüedad.<br><br>

    📅 <b>¿En qué fecha ingresaste a trabajar en
    ${escapeHTML(data.empresa)}?</b><br><br>

    Puedes escribirla, por ejemplo:<br>
    <b>22 de abril de 2020</b>
  `);

  enableInput(
    "Ej. 22 de abril de 2020",
    receiveStartDate
  );
}

function receiveStartDate(value){

  const date=parseSpanishDate(value);

  if(!date){

    addMessage(`
      🤖 No pude identificar correctamente la fecha.<br><br>
      Intenta escribirla como:<br><br>
      📅 <b>22 de abril de 2020</b><br>
      o<br>
      📅 <b>22/04/2020</b>
    `);

    enableInput(
      "Ej. 22 de abril de 2020",
      receiveStartDate
    );

    return;
  }

  const today=new Date();

  if(date>today){

    addMessage(`
      🤖 La fecha parece ser posterior a la fecha actual.<br><br>
      Por favor verifica tu fecha de ingreso.
    `);

    enableInput("Fecha de ingreso...",receiveStartDate);
    return;
  }

  data.fechaIngreso=formatDate(date);
  data.antiguedad=calculateYears(date,today);

  setTimeout(showVacationAnswer,500);
}

function showVacationAnswer(){

  addMessage(`
    <span class="ai-badge">✨ Orientación inteligente</span><br>

    De acuerdo con el
    <b>Contrato Colectivo de Trabajo de
    ${escapeHTML(data.empresa)}</b>
    y con la información que nos proporcionaste,
    ingresaste el <b>${escapeHTML(data.fechaIngreso)}</b>.<br><br>

    Actualmente cuentas con
    <b>${data.antiguedad}
    ${data.antiguedad===1 ? "año" : "años"} de antigüedad</b>.

    <div class="highlight">
      🏖️ Por tu antigüedad,
      te corresponden <b>20 días de vacaciones</b>.
    </div>

    ¿Tu duda quedó resuelta?
  `);

  addOptions([
    "✅ Sí, quedó resuelta",
    "💬 Tengo otra duda",
    "🤝 Quiero que CATEM revise mi caso"
  ],vacationResolution);
}

function vacationResolution(choice){

  if(choice.startsWith("✅")){

    addMessage(`
      ✅ <b>Consulta resuelta.</b><br><br>
      Nos da gusto haberte podido orientar. 🤝<br><br>
      El <b>Centro de Atención CATEM Aguascalientes</b>
      está para ayudarte.
    `);

    return;
  }

  if(choice.startsWith("💬")){

    addMessage(`
      💬 Claro. Cuéntame cuál es tu otra duda
      relacionada con tus vacaciones.
    `);

    enableInput(
      "Escribe tu duda...",
      receiveAdditionalVacationQuestion
    );

    return;
  }

  requestName();
}

function receiveAdditionalVacationQuestion(value){

  addMessage(`
    🤖 Gracias por explicarlo.<br><br>

    Para asegurar que recibas una orientación correcta,
    esta consulta requiere que <b>CATEM revise tu caso</b>.<br><br>

    Vamos a registrar tus datos para darle seguimiento. 🤝
  `);

  setTimeout(requestName,450);
}

/* FECHAS */

function parseSpanishDate(text){

  let clean=text
    .toLowerCase()
    .trim()
    .replace(/,/g,"")
    .replace(/\s+/g," ");

  let numeric=clean.match(
    /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
  );

  if(numeric){

    const day=parseInt(numeric[1]);
    const month=parseInt(numeric[2])-1;
    const year=parseInt(numeric[3]);

    const date=new Date(year,month,day);

    if(
      date.getFullYear()===year &&
      date.getMonth()===month &&
      date.getDate()===day
    ) return date;

    return null;
  }

  const months={
    enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,
    julio:6,agosto:7,septiembre:8,setiembre:8,
    octubre:9,noviembre:10,diciembre:11
  };

  const written=clean.match(
    /^(\d{1,2})\s+(?:de\s+)?([a-záéíóúñ]+)\s+(?:de\s+|del\s+)?(\d{4})$/
  );

  if(!written)return null;

  const day=parseInt(written[1]);
  const monthName=written[2];
  const year=parseInt(written[3]);

  if(months[monthName]===undefined)return null;

  const month=months[monthName];
  const date=new Date(year,month,day);

  if(
    date.getFullYear()!==year ||
    date.getMonth()!==month ||
    date.getDate()!==day
  ) return null;

  return date;
}

function calculateYears(start,end){

  let years=end.getFullYear()-start.getFullYear();

  const anniversary=new Date(
    end.getFullYear(),
    start.getMonth(),
    start.getDate()
  );

  if(end<anniversary)years--;

  return years;
}

function formatDate(date){

  return date.toLocaleDateString("es-MX",{
    day:"numeric",
    month:"long",
    year:"numeric"
  });
}

function showUpload(){

  continueButton.style.display="none";

  fileInput.onchange=()=>{

    data.evidencia=
      Array.from(fileInput.files).map(file=>file.name);

    fileList.innerHTML="";

    data.evidencia.forEach(name=>{

      const item=document.createElement("div");
      item.className="file-item";
      item.textContent="✅ "+name;
      fileList.appendChild(item);

    });

      continueButton.style.display="block";
    }
  };

  continueButton.onclick=()=>{

    box.remove();

    addMessage(
      `📎 ${data.evidencia.length} archivo(s) adjunto(s)`,
      "user"
    );

    setTimeout(showSummary,300);
  };

  box.appendChild(fileInput);
  box.appendChild(uploadButton);
  box.appendChild(fileList);
  box.appendChild(continueButton);

function handleCorrection(choice){

    addMessage("📝 Escribe nuevamente la descripción de tu situación.");

    enableInput("Nueva descripción...",value=>{
      data.descripcion=value;
      showSummary();
    });

    return;

  if(choice==="Nombre"){

    addMessage("👤 Escribe nuevamente tu nombre completo.");

    enableInput("Nombre completo...",value=>{
      data.nombre=value;
      showSummary();
    });

    return;
  }

  if(choice==="Número de empleado"){

    addMessage("🪪 Escribe nuevamente tu número de empleado.");

    enableInput("Número de empleado...",value=>{
      data.empleado=value;
      showSummary();
    });

    return;
  }

  if(choice==="Empresa"){

    addMessage("🏭 Selecciona nuevamente tu empresa.");

    addSelector(
      companies,
      "🏭 Seleccionar empresa",
      value=>{
        data.empresa=value;
        showSummary();
      }
    );

    return;
  }

  if(choice==="Tema o situación"){

    addMessage("📋 Selecciona nuevamente el tema.");

    addSelector(
      topics,
      "📋 Seleccionar tema",
      value=>{

        data.tema=value;

        if(value==="📝 Otro tema"){

          data.subtema="Otro tema";
          showSummary();

        }else{

          addMessage(`
            <b>${escapeHTML(value)}</b><br><br>
            Selecciona nuevamente la situación.
          `);

          addOptions(
            subtopics[value],
            sub=>{
              data.subtema=sub;
              showSummary();
            }
          );
        }
      }
    );

    return;
  }

  if(choice==="Evidencia"){

    data.evidencia=[];

    addMessage(`
      📎 Selecciona nuevamente si deseas adjuntar evidencia.
    `);

    addOptions([
      "📎 Sí, adjuntar evidencia",
      "Continuar sin evidencia"
    ],value=>{

      if(value.startsWith("📎")){
        showUpload();
      }else{
        showSummary();
      }

    });
  }
}
